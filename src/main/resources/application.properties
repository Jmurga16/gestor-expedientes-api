# Los valores se leen de variables de entorno.
#  - Local: archivo .env en la raiz del proyecto (ver .env.example)
#  - Azure App Service: Configuration > Application settings
spring.config.import=optional:file:.env[.properties]

# mongodb
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:db_expedientes}

# security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000}

# cors (origenes del front separados por coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://gestor-expedientesv1.azurewebsites.net}

# rate limit de login (en memoria, por IP)
security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.window-seconds=${LOGIN_WINDOW_SECONDS:300}
security.login.block-seconds=${LOGIN_BLOCK_SECONDS:900}

# blob storage
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY:}
# Azurite u otro endpoint: tiene prioridad sobre la cuenta y la clave
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
# URL con la que el navegador ve los blobs (vacio = la de la cuenta)
azure.storage.public-endpoint=${AZURE_STORAGE_PUBLIC_ENDPOINT:}

# uploads (FileService valida ademas 2 MB por archivo)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# rate limit de uploads (en memoria, por usuario)
security.upload.max-per-window=${UPLOAD_MAX_PER_WINDOW:10}
security.upload.window-seconds=${UPLOAD_WINDOW_SECONDS:600}
